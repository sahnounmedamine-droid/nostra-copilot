<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nostra CoPilot</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1d2433;--muted:#6b7280;--pri:#0f766e;--pri2:#14b8a6;--red:#dc2626;--line:#e8ebef;--a:#2563eb;--m:#db2777;--ok:#16a34a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 2px 10px rgba(15,118,110,.25)}
header h1{flex:1;margin:0;font-size:18px;font-weight:700}
.ib{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.ib.dark{background:#eef2f5;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px}
h2.hello{margin:4px 0 2px;font-size:22px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.home{display:grid;gap:12px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);color:inherit;font:inherit}
.hcard .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.hcard .lbl{font-size:13px;color:var(--muted)}
.hcard .val{display:block;font-size:20px;font-weight:700;margin-top:2px}
.hcard .go{margin-left:auto;color:var(--muted);font-size:22px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.card h3{margin:4px 0 10px;font-size:16px}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:8px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.month-nav strong{font-size:16px}
.grid-head,.row{display:grid;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.grid-head{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line)}
.dep{grid-template-columns:1fr auto 32px}
.infl{grid-template-columns:1.4fr 1fr 36px 1fr 30px}
.cell-name{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;min-width:0}
.cell-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-amt{text-align:right;font-variant-numeric:tabular-nums;cursor:pointer;font-weight:600;white-space:nowrap}
.x{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--red);font-weight:700;cursor:pointer;font-size:13px;padding:0}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.badge.a{background:var(--a)}
.badge.m{background:var(--m)}
.chk{width:36px;height:36px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0}
.chk.on{color:var(--ok)}
.reste{color:#b45309}
.reste.zero{color:var(--ok)}
.add-line{margin-top:10px;width:100%;padding:12px;border:2px dashed #cbd5e1;background:none;border-radius:12px;color:var(--pri);font-weight:600;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--pri);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:15px}
.total strong{font-size:18px}
.table-wrap{overflow-x:auto}
table.ann{width:100%;border-collapse:collapse;font-size:13px}
.ann th,.ann td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ann th:first-child,.ann td:first-child{text-align:left}
.ann tr.cur td{background:#ecfdf5;font-weight:600}
.ann tfoot th{border-top:2px solid var(--line)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(15,118,110,.4);cursor:pointer;z-index:8}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:12px;font-family:inherit}
.tabbar .i{font-size:22px}
.tabbar button.on{color:var(--pri);font-weight:700;background:#ecfdf5}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
#confirm{z-index:25}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:18px}
.confirm-msg{font-size:15px;line-height:1.4;margin:0 0 6px}
.field{margin-bottom:14px}
.field label,.field .lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
.payeur-group{display:flex;gap:8px;flex-wrap:wrap}
.payeur-group button{flex:1;min-width:90px;padding:11px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.payeur-group button.sel{border-color:var(--pri);background:#ecfdf5;font-weight:700}
.btn-primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit}
.btn-danger{width:100%;padding:12px;border:0;border-radius:14px;background:#fee2e2;color:var(--red);font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit}
.btn-cancel{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:14px;background:#fff;color:var(--ink);font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-size:14px;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.inv{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer}
.inv-head small{display:block;color:var(--muted);margin-top:2px}
.inv-amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center;font-size:12px;color:var(--muted)}
.inv-amts b{display:block;color:var(--ink);font-size:14px;margin-top:2px}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:9px;border-radius:999px;border:1px solid #d1d5db;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:#dbeafe;border-color:#93c5fd;color:#1e40af;font-weight:600}
.chip.on.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.login{margin-top:40px;text-align:center}
.login form{display:grid;gap:10px;margin-top:16px}
.login input{padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;font-family:inherit}
.logo{font-size:44px}
.empty{color:var(--muted);text-align:center;padding:14px}
.row.fixe{background:#334155;color:#fff;border-bottom-color:transparent;border-radius:12px;margin:4px 0}
.row.fixe .x{color:#fca5a5}
.badge-fixe{display:inline-block;padding:2px 8px;border-radius:999px;background:#fff;color:#334155;font-size:11px;font-weight:700;flex:none}
.row.fixe{padding:12px 14px}
.grid-head.infl span:nth-child(n+2):nth-child(-n+4){text-align:center}
.infl .cell-amt{text-align:center}
.infl .chk{justify-self:center}

/* ---------- Ajouts : menu, filtres, export, corbeille ---------- */
.drawer{position:fixed;inset:0;z-index:40}
.drawer-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.drawer-panel{position:absolute;left:0;top:0;bottom:0;width:270px;max-width:80%;background:#fff;padding:calc(20px + env(safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 0 18px rgba(0,0,0,.15);animation:gauche .2s ease}
@keyframes gauche{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.drawer-title{margin:0 0 6px;font-size:18px}
.menu-item{width:100%;padding:14px;border:0;background:#f3f5f7;border-radius:14px;text-align:left;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.filtres input,.filtres select{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;font-family:inherit;background:#fff;margin-bottom:8px}
.filtres .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filtres .row2 select{margin-bottom:0}
.filtres input:last-child,.filtres .row2:last-child{margin-bottom:0}
.export-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.btn-export{padding:12px;border:0;border-radius:14px;background:#fff;color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<header>
  <button id="menu" class="ib" data-act="openMenu" aria-label="Menu" hidden>☰</button>
  <button id="back" class="ib" data-act="back" aria-label="Retour" hidden>‹</button>
  <h1 id="title">Nostra CoPilot</h1>
  <button id="logout" class="ib" data-act="logout" aria-label="Déconnexion" hidden>⎋</button>
</header>

<main id="main"></main>

<nav id="tabbar" class="tabbar" hidden>
  <button data-act="nav" data-id="home"><span class="i">🏠</span>Accueil</button>
  <button data-act="nav" data-id="depenses"><span class="i">💸</span>Dépenses</button>
  <button data-act="nav" data-id="influence"><span class="i">🤝</span>Influence</button>
  <button data-act="nav" data-id="artemis"><span class="i">🧾</span>Artemis DL</button>
</nav>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg" data-act="closeMenu"></div>
  <aside class="drawer-panel">
    <h2 class="drawer-title">Menu</h2>
    <button class="menu-item" data-act="sauvegarde">💾 Sauvegarde</button>
    <button class="menu-item" data-act="restaurer">♻️ Restauration</button>
    <button class="menu-item" data-act="corbeilleView">🗑️ Corbeille</button>
    <button class="menu-item" data-act="closeMenu">Fermer</button>
  </aside>
</div>
<input type="file" id="fichier-restore" accept=".json,application/json" hidden>

<div id="modal" class="modal"></div>
<div id="confirm" class="modal"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhHP87nEP3_KlYnheJ5Qt-JcMKc2C4JxQ",
  authDomain: "artemis-d9175.firebaseapp.com",
  databaseURL: "https://artemis-d9175-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "artemis-d9175",
  storageBucket: "artemis-d9175.firebasestorage.app",
  messagingSenderId: "89751197725",
  appId: "1:89751197725:web:d91d282b1ff31433ac4ef4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ---------- Utilitaires ---------- */
const MOIS_NOMS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const TITRES = {home:'Nostra CoPilot', depenses:'💸 Dépenses', influence:'🤝 Influence', artemis:'🧾 Artemis DL', corbeille:'🗑️ Corbeille'};
const pad = n => String(n).padStart(2,'0');
const moisCourant = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function decalerMois(m, delta){ const [y,mo] = m.split('-').map(Number); const d = new Date(y, mo-1+delta, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function labelMois(m){ const [y,mo] = m.split('-'); return `${MOIS_NOMS[+mo-1]} ${y}`; }
const fmt = n => `${((Math.round((Number(n)||0)*1000))/1000).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3})} DT`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(s){ const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? '' : n; }
function badge(p){ return p==='A' ? '<span class="badge a">A</span>' : p==='M' ? '<span class="badge m">M</span>' : ''; }
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- État ---------- */
const state = { user:null, loaded:false, view:'home', mois:moisCourant(), data:normaliser(null) };
let listening = false;
/* Filtres mémorisés pendant la session */
const filtres = { depenses:{q:'', payeur:'tous', type:'tous'}, influence:{q:'', statut:'tous'} };
function normaliser(v){
  v = v || {};
  return { chargesFixes: v.chargesFixes||{}, depenses: v.depenses||{}, influence: v.influence||{}, artemis: v.artemis||{}, corbeille: v.corbeille||{} };
}
/* Écriture groupée à partir de la racine "nostra" */
const maj = obj => db.ref('nostra').update(obj);

/* ---------- Calculs ---------- */
function listFixes(){
  return Object.entries(state.data.chargesFixes)
    .map(([id,v]) => ({id, nom:v.nom||'', ordre:v.ordre ?? 0}))
    .sort((a,b) => a.ordre - b.ordre || a.nom.localeCompare(b.nom));
}
/* Montant d'une charge fixe pour un mois : on reprend la dernière valeur connue */
function valeurFixe(k, m){
  const mois = Object.keys(state.data.depenses).filter(x => x <= m).sort().reverse();
  for (const x of mois){
    const v = state.data.depenses[x]?.fixes?.[k];
    if (v) return { montant: Number(v.montant)||0, payeur: v.payeur||'' };
  }
  return { montant:0, payeur:'' };
}
function listExtras(m){ return Object.entries(state.data.depenses[m]?.extras||{}).map(([id,v]) => ({id, ...v})); }
function totalFixes(m){ return listFixes().reduce((s,f) => s + valeurFixe(f.id, m).montant, 0); }
function totalExtras(m){ return listExtras(m).reduce((s,e) => s + (Number(e.montant)||0), 0); }
function totalDepenses(m){ return totalFixes(m) + totalExtras(m); }
function listInfl(m){ return Object.entries(state.data.influence[m]||{}).map(([id,v]) => ({id, ...v})); }
function resteInfl(i){ return Math.max(0, (Number(i.montant)||0) - (Number(i.verse)||0)); }
function listArt(){ return Object.entries(state.data.artemis).map(([id,v]) => ({id, ...v})).sort((a,b) => (b.date||'').localeCompare(a.date||'')); }
function tvaArt(a){ return (Number(a.ht)||0) * (Number(a.taux)||0) / 100; }

/* ---------- Firebase : connexion et écoute ---------- */
auth.onAuthStateChanged(u => {
  state.user = u;
  if (u) {
    startListeners();
  } else {
    db.ref('nostra').off();
    listening = false;
    state.loaded = false;
    state.data = normaliser(null);
    state.view = 'home';
  }
  render();
});

function startListeners(){
  if (listening) return;
  listening = true;
  db.ref('nostra').on('value', snap => {
    state.data = normaliser(snap.val());
    state.loaded = true;
    render();
  }, () => toast('Accès refusé : vérifiez que les règles Firebase sont publiées.'));

  /* Charges fixes de départ, créées une seule fois */
  db.ref('nostra/seeded').transaction(cur => cur ? undefined : true)
    .then(r => { if (r.committed) seed(); })
    .catch(() => {});
}
function seed(){
  const ref = db.ref('nostra/chargesFixes');
  const up = {};
  ['Loyer','SONED','STEG','Femme de ménage','BTS'].forEach((nom, i) => { up[ref.push().key] = {nom, ordre:i}; });
  ref.update(up);
}

/* ---------- Rendu ---------- */
function render(){
  const connecte = !!state.user;
  document.getElementById('tabbar').hidden = !connecte;
  document.getElementById('logout').hidden = !connecte;
  document.getElementById('menu').hidden = !connecte;
  document.getElementById('back').hidden = !connecte || state.view === 'home';
  document.getElementById('title').textContent = TITRES[state.view] || 'Nostra CoPilot';
  const main = document.getElementById('main');
  if (!connecte){ document.getElementById('drawer').hidden = true; main.innerHTML = viewLogin(); return; }
  if (!state.loaded){ main.innerHTML = '<p class="empty">Chargement…</p>'; return; }
  main.innerHTML = VIEWS[state.view]();
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.id === state.view));
}
const VIEWS = { home:()=>viewHome(), depenses:()=>viewDepenses(), influence:()=>viewInfluence(), artemis:()=>viewArtemis(), corbeille:()=>viewCorbeille() };

function viewLogin(){
  return `<div class="card login"><div class="logo">🧭</div><h2 class="hello">Nostra CoPilot</h2>
  <p class="sub">Connectez-vous pour accéder à vos données</p>
  <form id="login-form">
    <input name="email" type="email" placeholder="E-mail" required autocomplete="username">
    <input name="password" type="password" placeholder="Mot de passe" required autocomplete="current-password">
    <button class="btn-primary" type="submit">Se connecter</button>
  </form></div>`;
}

function homeCard(ico, lbl, val, id, bg){
  return `<button class="hcard" data-act="nav" data-id="${id}">
    <span class="ico" style="background:${bg}">${ico}</span>
    <span><span class="lbl">${lbl}</span><span class="val">${val}</span></span>
    <span class="go">›</span></button>`;
}
function viewHome(){
  const c = moisCourant();
  const reste = listInfl(c).reduce((s,i) => s + resteInfl(i), 0);
  const tva = listArt().filter(a => a.payee).reduce((s,a) => s + tvaArt(a), 0);
  return `<h2 class="hello">Bonjour 👋</h2>
  <p class="sub">${labelMois(c)} · Votre espace commun</p>
  <div class="home">
    ${homeCard('💸','Dépenses du mois', fmt(totalDepenses(c)), 'depenses', '#ecfdf5')}
    ${homeCard('🤝','Reste à payer (Influence)', fmt(reste), 'influence', '#fff7ed')}
    ${homeCard('🧾','TVA cumulée (Artemis DL)', fmt(tva), 'artemis', '#eff6ff')}
  </div>`;
}

function monthNav(m){
  return `<div class="month-nav">
    <button class="ib dark" data-act="mois" data-d="-1" aria-label="Mois précédent">‹</button>
    <strong>${labelMois(m)}</strong>
    <button class="ib dark" data-act="mois" data-d="1" aria-label="Mois suivant">›</button>
  </div>`;
}
function fab(act){ return `<button class="fab" data-act="${act}" aria-label="Ajouter">＋</button>`; }

/* Tableau annuel : une ligne par mois de l'année, jusqu'au mois en cours */
function tableauAnnuel(m, cols){
  const y = m.slice(0,4), cur = moisCourant();
  const sums = cols.map(() => 0);
  const lignes = [];
  for (let i = 1; i <= 12; i++){
    const k = `${y}-${pad(i)}`;
    const futur = k > cur;
    const vals = cols.map(c => futur ? null : c.fn(k));
    vals.forEach((v,j) => { if (v !== null) sums[j] += v; });
    lignes.push(`<tr class="${k===m?'cur':''}"><td>${MOIS_NOMS[i-1]}</td>${vals.map(v => `<td>${v===null?'—':fmt(v)}</td>`).join('')}</tr>`);
  }
  return `<div class="card">
    <div class="month-nav" style="margin-bottom:10px">

/* ---------- Filtres (Dépenses et Influence) ---------- */

  return `<option value="${valeur}" ${String(valeur)===String(actuelle)?'selected':''}>${libelle}</option>`;
}
function barreFiltres(sec){
  if (sec === 'depenses'){
    const f = filtres.depenses;
    return `<div class="card filtres">
      <input type="search" placeholder="Rechercher une dépense…" data-filtre="depenses.q" value="${esc(f.q)}">

        <select data-filtre="depenses.payeur">
          ${opt('tous','Tous les payeurs',f.payeur)}${opt('A','Amine',f.payeur)}${opt('M','Myriam',f.payeur)}
        </select>
        <select data-filtre="depenses.type">
          ${opt('tous','Toutes',f.type)}${opt('fixe','Fixes',f.type)}${opt('extra','Ponctuelles',f.type)}
        </select>
      </div>
    </div>`;
  }

  return `<div class="card filtres">
    <input type="search" placeholder="Rechercher un projet…" data-filtre="influence.q" value="${esc(f.q)}">
    <select data-filtre="influence.statut">

    </select>
  </div>`;
}
/* Rafraîchit seulement la zone de liste, pour ne pas perdre le focus de la recherche */
function rafraichirZone(sec){
  const z = document.getElementById('zone-' + sec);
  if (z) z.innerHTML = sec === 'depenses' ? zoneDepenses() : zoneInfluence();
}
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  const cle = e.target.dataset && e.target.dataset.filtre;
  if (!cle) return;
  const [sec, champ] = cle.split('.');

/* Boutons d'export */
function barreExport(src){
  return `<div class="export-bar">
    <button class="btn-export" data-act="exportCsv" data-src="${src}">⬇ Export CSV</button>
    <button class="btn-export" data-act="exportPdf" data-src="${src}">🖨 Export PDF</button>

}

/* Onglet 1 : Dépenses */
function rowDep(d){
  const ds = `data-act="editDep" data-id="${esc(d.id)}" data-kind="${d.kind}"`;
  const fixe = d.kind === 'fixe';
  return `<div class="row dep${fixe ? ' fixe' : ''}">
    <div class="cell-name" ${ds}><span>${esc(d.nom)}</span>${fixe ? '<span class="badge-fixe">Fixe</span>' : ''}${badge(d.payeur)}</div>
    <div class="cell-amt" ${ds}>${fmt(d.montant)}</div>
    <button class="x" data-act="delDep" data-id="${esc(d.id)}" data-kind="${d.kind}" aria-label="Supprimer">✕</button>
  </div>`;
}
function zoneDepenses(){
  const m = state.mois, f = filtres.depenses, q = f.q.trim().toLowerCase();
  const actif = !!q || f.payeur !== 'tous' || f.type !== 'tous';
  const ok = d => (!q || String(d.nom||'').toLowerCase().includes(q))
    && (f.payeur === 'tous' || d.payeur === f.payeur)
    && (f.type === 'tous' || (f.type === 'fixe') === (d.kind === 'fixe'));
  const fixes = listFixes().map(x => { const v = valeurFixe(x.id, m); return {id:x.id, nom:x.nom, montant:v.montant, payeur:v.payeur, kind:'fixe'}; }).filter(ok);
  const extras = listExtras(m).map(e => ({id:e.id, nom:e.nom, montant:e.montant, payeur:e.payeur, kind:'extra'})).filter(ok);
  const total = [...fixes, ...extras].reduce((s,d) => s + (Number(d.montant)||0), 0);
  const vide = fixes.length + extras.length === 0 && actif ? '<p class="empty">Aucune dépense ne correspond.</p>' : '';
  return `<div class="card">
    <div class="grid-head dep"><span>Nom de la dépense</span><span>Montant</span><span></span></div>
    ${fixes.map(rowDep).join('')}
    ${extras.map(rowDep).join('')}
    ${vide}
    <button class="add-line" data-act="addFixe">＋ Ajouter une charge fixe</button>
  </div>
  <div class="total"><span>${actif ? 'Total affiché' : 'Total ' + labelMois(m)}</span><strong>${fmt(total)}</strong></div>`;
}
function viewDepenses(){
  const m = state.mois;
  return monthNav(m) + barreFiltres('depenses') + `<div id="zone-depenses">${zoneDepenses()}</div>`
    + barreExport('depenses')
    + tableauAnnuel(m, [{label:'Dépenses', fn:k => totalDepenses(k)}])
    + fab('addDep');
}

/* Onglet 2 : Influence */
function zoneInfluence(){
  const m = state.mois, f = filtres.influence, q = f.q.trim().toLowerCase();
  const actif = !!q || f.statut !== 'tous';
  const items = listInfl(m).filter(i => {
    const paye = Number(i.montant) > 0 && Number(i.verse) >= Number(i.montant);
    return (!q || String(i.projet||'').toLowerCase().includes(q))
      && (f.statut === 'tous' || (f.statut === 'paye') === paye);
  });
  const rows = items.map(i => {
    const paid = Number(i.montant) > 0 && Number(i.verse) >= Number(i.montant);
    const ds = `data-act="editInfl" data-id="${esc(i.id)}"`;
    return `<div class="row infl">
      <div class="cell-name" ${ds}><span>${esc(i.projet)}</span></div>
      <div class="cell-amt" ${ds}>${fmt(i.montant)}</div>
      <button class="chk ${paid?'on':''}" data-act="toggleInfl" data-id="${esc(i.id)}" aria-label="Payé">${paid?'☑':'☐'}</button>
      <div class="cell-amt reste ${paid?'zero':''}" ${ds}>${fmt(resteInfl(i))}</div>
      <button class="x" data-act="delInfl" data-id="${esc(i.id)}" aria-label="Supprimer">✕</button>
    </div>`;
  }).join('') || `<p class="empty">${actif ? 'Aucun projet ne correspond.' : 'Aucun projet pour ce mois-ci.'}</p>`;
  const totalMontant = items.reduce((s,i) => s + (Number(i.montant)||0), 0);
  const totalReste = items.reduce((s,i) => s + resteInfl(i), 0);
  const totalPaye = totalMontant - totalReste;
  return `<div class="card">
    <div class="grid-head infl"><span>Projet</span><span>Montant</span><span>Payé</span><span>Reste</span><span></span></div>
    ${rows}
  </div>
    <div class="total"><span>Reste à payer</span><strong>${fmt(totalReste)}</strong></div>
  <div class="total" style="background:#334155"><span>Montant total payé</span><strong>${fmt(totalPaye)}</strong></div>
  <div class="total" style="background:#334155"><span>Montant total</span><strong>${fmt(totalPaye + totalReste)}</strong></div>`;
}
function viewInfluence(){
  const m = state.mois;
  return monthNav(m) + barreFiltres('influence') + `<div id="zone-influence">${zoneInfluence()}</div>`
    + barreExport('influence')
    + tableauAnnuel(m, [
      {label:'Montant', fn:k => listInfl(k).reduce((s,i) => s + (Number(i.montant)||0), 0)},
      {label:'Reste', fn:k => listInfl(k).reduce((s,i) => s + resteInfl(i), 0)}
    ])
    + fab('addInfl');
}

/* Onglet 3 : Artemis DL */
function viewArtemis(){
  const arts = listArt();
  const tvaTotale = arts.filter(a => a.payee).reduce((s,a) => s + tvaArt(a), 0);
  const htEnvoye = arts.filter(a => a.envoyee).reduce((s,a) => s + (Number(a.ht)||0), 0);
  const cards = arts.map(a => {
    const tva = tvaArt(a);
    const ttc = (Number(a.ht)||0) + tva;
    const id = esc(a.id);
    return `<div class="inv">
      <div class="inv-head" data-act="editArt" data-id="${id}">
        <div><strong>${esc(a.client||'Sans nom')}</strong><small>${esc(a.numero||'')}${a.date ? ' · ' + esc(a.date) : ''}</small></div>
        <button class="x" data-act="delArt" data-id="${id}" aria-label="Supprimer">✕</button>
      </div>
      <div class="inv-amts">
        <span>HT<b>${fmt(a.ht)}</b></span>
        <span>TVA ${esc(a.taux)} %<b>${fmt(tva)}</b></span>
        <span>TTC<b>${fmt(ttc)}</b></span>

      <div class="chips">
        <button class="chip ${a.envoyee?'on':''}" data-act="toggleArt" data-id="${id}" data-champ="envoyee">📤 ${a.envoyee?'Envoyée':'Non envoyée'}</button>
        <button class="chip ${a.payee?'on ok':''}" data-act="toggleArt" data-id="${id}" data-champ="payee">💰 ${a.payee?'Payée':'Non payée'}</button>
      </div>

  }).join('') || '<p class="empty">Aucune facture pour le moment.</p>';

  <div class="total" style="background:#334155"><span>Total facturé HT (factures envoyées)</span><strong>${fmt(htEnvoye)}</strong></div>

  ${fab('addArt')}`;

/* Corbeille : éléments supprimés, restaurables sans limite de temps */
function libelleCorbeille(c){
  switch (c.type){
    case 'extra': return `Dépense : ${c.data?.nom||''} (${labelMois(c.mois)})`;
    case 'fixe': return `Charge fixe : ${c.data?.nom||''}`;
    case 'projet': return `Projet : ${c.data?.projet||''} (${labelMois(c.mois)})`;
    case 'facture': return `Facture : ${c.data?.client||'Sans nom'} ${c.data?.numero||''}`;
    default: return 'Élément supprimé';
  }
}
function viewCorbeille(){
  const items = Object.entries(state.data.corbeille||{})
    .map(([cle,v]) => ({...v, cle}))
    .sort((a,b) => (b.supprimeLe||0) - (a.supprimeLe||0));
  if (!items.length) return '<p class="empty">La corbeille est vide.</p>';
  return items.map(c => `<div class="inv">
    <div><strong>${esc(libelleCorbeille(c))}</strong><small>Supprimé le ${new Date(c.supprimeLe||0).toLocaleDateString('fr-FR')}</small></div>
    <div class="chips" style="margin-top:10px">
      <button class="chip on" data-act="restaurerCorbeille" data-id="${esc(c.cle)}">↩ Restaurer</button>
      <button class="chip" style="color:var(--red)" data-act="purgerCorbeille" data-id="${esc(c.cle)}">Supprimer définitivement</button>
    </div>
  </div>`).join('');
}

/* ---------- Formulaires (fenêtre modale) ---------- */
let currentForm = null;
function fieldHtml(f){
  const req = f.required ? ' required' : '';
  if (f.type === 'payeur') return `<div class="field">
    <span class="lab">${esc(f.label)}${f.required?' *':''}</span>
    <div class="payeur-group">
      <button type="button" data-val="A" class="${f.value==='A'?'sel':''}"><span class="badge a">A</span> Amine</button>
      <button type="button" data-val="M" class="${f.value==='M'?'sel':''}"><span class="badge m">M</span> Myriam</button>
      ${f.required ? '' : `<button type="button" data-val="" class="${!f.value?'sel':''}">Aucun</button>`}
    </div>
    <input type="hidden" id="f-${f.name}" value="${esc(f.value||'')}">
  </div>`;
  if (f.type === 'select') return `<div class="field">
    <label for="f-${f.name}">${esc(f.label)}</label>
    <select id="f-${f.name}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v)===String(f.value)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>
  </div>`;
  const numAttr = f.type === 'number' ? ' inputmode="decimal" step="0.001" min="0"' : '';
  return `<div class="field">
    <label for="f-${f.name}">${esc(f.label)}${f.required?' *':''}</label>
    <input id="f-${f.name}" type="${f.type||'text'}" value="${esc(f.value ?? '')}"${numAttr}${req}>
  </div>`;
}
function openForm(cfg){
  currentForm = cfg;
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="sheet" role="dialog">
    <div class="sheet-head"><h2>${esc(cfg.title)}</h2>
      <button type="button" class="ib dark" data-act="closeModal" aria-label="Fermer">✕</button></div>
    <form id="f" novalidate>
      ${cfg.fields.map(fieldHtml).join('')}
      <button class="btn-primary" type="submit">${esc(cfg.submit || 'Enregistrer')}</button>
      ${cfg.onDelete ? '<button type="button" class="btn-danger" data-act="formDelete">Mettre à la corbeille</button>' : ''}
    </form></div>`;
  modal.classList.add('open');
  modal.querySelectorAll('.payeur-group').forEach(g => g.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-val]');
    if (!b) return;
    g.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
    g.parentElement.querySelector('input[type=hidden]').value = b.dataset.val;
  }));
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  currentForm = null;
}
function submitForm(){
  const cfg = currentForm;
  if (!cfg) return;
  const vals = {};
  let ok = true;
  cfg.fields.forEach(f => {
    const el = document.getElementById('f-' + f.name);
    const v = f.type === 'number' ? parseNum(el.value) : el.value.trim();
    if (f.required && (v === '' || v === null)) ok = false;
    vals[f.name] = v;
  });
  if (!ok){ toast('Merci de remplir les champs obligatoires'); return; }
  cfg.onSubmit(vals);
  closeModal();
}

/* Confirmation dans l'application, sans limite de temps */
let confirmCb = null;
function askConfirm(msg, onOk, label){

}
function closeConfirm(){

}

/* Suppressions : l'entrée part dans la corbeille (confirmation faite avant l'appel) */
function supprVersCorbeille(entree, updates){
  const key = db.ref('nostra/corbeille').push().key;
  updates[`corbeille/${key}`] = {...entree, supprimeLe: Date.now()};
  maj(updates);
}
function supprFixe(k){
  const f = state.data.chargesFixes[k];
  if (!f) return;
  const up = {[`chargesFixes/${k}`]: null};
  const valeurs = {};
  Object.keys(state.data.depenses).forEach(mm => {
    const v = state.data.depenses[mm]?.fixes?.[k];
    if (v !== undefined){ valeurs[mm] = {...v}; up[`depenses/${mm}/fixes/${k}`] = null; }
  });
  supprVersCorbeille({type:'fixe', id:k, data:{...f}, valeurs}, up);
  toast('Charge fixe mise à la corbeille');
}
function supprExtra(id){
  const m = state.mois;
  const e = state.data.depenses[m]?.extras?.[id];
  if (!e) return;
  supprVersCorbeille({type:'extra', mois:m, id, data:{...e}}, {[`depenses/${m}/extras/${id}`]: null});
  toast('Dépense mise à la corbeille');
}

/* Corbeille : restaurer ou supprimer définitivement */
function restaurerCorbeille(id){
  const c = state.data.corbeille[id];
  if (!c) return;
  const up = {[`corbeille/${id}`]: null};
  if (c.type === 'extra') up[`depenses/${c.mois}/extras/${c.id}`] = c.data;
  else if (c.type === 'fixe'){
    up[`chargesFixes/${c.id}`] = c.data;
    Object.entries(c.valeurs||{}).forEach(([mm, v]) => { up[`depenses/${mm}/fixes/${c.id}`] = v; });
  }
  else if (c.type === 'projet') up[`influence/${c.mois}/${c.id}`] = c.data;
  else if (c.type === 'facture') up[`artemis/${c.id}`] = c.data;
  maj(up);
  toast('Élément restauré');
}
function purgerCorbeille(id){
  askConfirm('Supprimer définitivement cet élément ? Cette action est irréversible.', () => {
    maj({[`corbeille/${id}`]: null});
    toast('Supprimé définitivement');
  }, 'Supprimer définitivement');
}

/* ---------- Sauvegarde, restauration, export ---------- */
function telecharger(contenu, nom, type){
  const blob = new Blob([contenu], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Télécharge toute la racine "nostra" */
function sauvegarder(){
  return db.ref('nostra').once('value').then(snap => {
    telecharger(JSON.stringify(snap.val() || {}, null, 2), `sauvegarde-${today()}.json`, 'application/json');
    toast('Sauvegarde téléchargée');
  });
}
/* Lit un fichier, vérifie son contenu, demande deux confirmations, puis remplace tout */
document.getElementById('fichier-restore').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { toast('Fichier invalide'); return; }
    const cles = ['chargesFixes','depenses','influence','artemis','corbeille'];
    if (!data || typeof data !== 'object' || !cles.some(k => k in data)){
      toast('Ce fichier ne ressemble pas à une sauvegarde Nostra');
      return;
    }
    const nb = o => Object.keys(o||{}).length;
    const dep = Object.values(data.depenses||{}).reduce((s,mo) => s + Object.keys(mo?.extras||{}).length, 0);
    const proj = Object.values(data.influence||{}).reduce((s,mo) => s + Object.keys(mo||{}).length, 0);
    askConfirm(`Restaurer cette sauvegarde ? Elle remplacera TOUTES les données actuelles (${nb(data.chargesFixes)} charges fixes, ${dep} dépenses ponctuelles, ${proj} projets, ${nb(data.artemis)} factures). Une sauvegarde de sécurité sera téléchargée d'abord.`, () => {
      const mot = prompt('Pour confirmer, tapez RESTAURER en majuscules :');
      if (mot !== 'RESTAURER'){ toast('Restauration annulée'); return; }
      sauvegarder()
        .then(() => db.ref('nostra').set(data))
        .then(() => toast('Données restaurées'))
        .catch(() => toast('Échec de la restauration'));
    }, 'Continuer');
  };
  reader.readAsText(file);
});

/* Données d'export : mois affiché (non filtré) et bilan annuel jusqu'au mois en cours */
function donneesExport(src){
  const m = state.mois, y = m.slice(0,4), cur = moisCourant();
  const mois12 = [];
  for (let i = 1; i <= 12; i++){
    const k = `${y}-${pad(i)}`;
    if (k <= cur) mois12.push({k, nom: MOIS_NOMS[i-1]});
  }
  const payeurNom = p => p === 'A' ? 'Amine' : p === 'M' ? 'Myriam' : '';
  if (src === 'depenses'){
    const lignes = [
      ...listFixes().map(f => { const v = valeurFixe(f.id, m); return [f.nom, 'Fixe', payeurNom(v.payeur), v.montant]; }),
      ...listExtras(m).map(e => [e.nom||'', 'Ponctuelle', payeurNom(e.payeur), Number(e.montant)||0])
    ];
    return {
      titre: 'Dépenses', periode: labelMois(m),
      colonnes: ['Nom','Type','Payeur','Montant (DT)'],
      lignes,
      total: ['Total','','', totalDepenses(m)],
      annee: {
        titre: `Bilan ${y}`,
        colonnes: ['Mois','Dépenses (DT)'],
        lignes: mois12.map(x => [x.nom, totalDepenses(x.k)]),
        total: ['Total', mois12.reduce((s,x) => s + totalDepenses(x.k), 0)]
      }
    };
  }
  const items = listInfl(m);
  const estPaye = i => Number(i.montant) > 0 && Number(i.verse) >= Number(i.montant);
  const sumM = k => listInfl(k).reduce((s,i) => s + (Number(i.montant)||0), 0);
  const sumR = k => listInfl(k).reduce((s,i) => s + resteInfl(i), 0);
  return {
    titre: 'Influence', periode: labelMois(m),
    colonnes: ['Projet','Montant (DT)','Déjà payé (DT)','Reste (DT)','Statut'],
    lignes: items.map(i => [i.projet||'', Number(i.montant)||0, Number(i.verse)||0, resteInfl(i), estPaye(i) ? 'Payé' : 'Non payé']),
    total: ['Total', sumM(m), items.reduce((s,i) => s + (Number(i.verse)||0), 0), sumR(m), ''],
    annee: {
      titre: `Bilan ${y}`,
      colonnes: ['Mois','Montant (DT)','Reste (DT)'],
      lignes: mois12.map(x => [x.nom, sumM(x.k), sumR(x.k)]),
      total: ['Total', mois12.reduce((s,x) => s + sumM(x.k), 0), mois12.reduce((s,x) => s + sumR(x.k), 0)]
    }
  };
}
/* CSV : séparateur ;, UTF-8 avec BOM pour qu'Excel affiche bien les accents */
function ligneCsv(arr){
  return arr.map(v => {
    if (typeof v === 'number') return String(Math.round(v*1000)/1000).replace('.',',');
    return `"${String(v ?? '').replace(/"/g,'""')}"`;
  }).join(';');
}
function exportCsv(src){
  const d = donneesExport(src);
  const L = [
    ligneCsv([`${d.titre} - ${d.periode}`]),
    ligneCsv(d.colonnes),
    ...d.lignes.map(l => ligneCsv(l)),
    ligneCsv(d.total),
    '',
    ligneCsv([d.annee.titre]),
    ligneCsv(d.annee.colonnes),
    ...d.annee.lignes.map(l => ligneCsv(l)),
    ligneCsv(d.annee.total)
  ];
  telecharger('\uFEFF' + L.join('\r\n'), `${src}-${state.mois}.csv`, 'text/csv;charset=utf-8');
  toast('Export CSV prêt');
}
/* PDF : page imprimable ouverte dans un nouvel onglet, puis impression */
function tablePdf(cols, lignes, total){
  const cell = v => typeof v === 'number' ? `<td class="n">${fmt(v)}</td>` : `<td>${esc(v)}</td>`;
  const th = v => typeof v === 'number' ? `<th class="n">${fmt(v)}</th>` : `<th>${esc(v)}</th>`;
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${lignes.map(l => `<tr>${l.map(v => cell(v)).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr>${total.map(v => th(v)).join('')}</tr></tfoot></table>`;
}
function exportPdf(src){
  const d = donneesExport(src);
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
  <title>${esc(d.titre)} ${esc(d.periode)}</title>
  <style>body{font-family:Arial,sans-serif;margin:24px;color:#111}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:24px 0 8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}th{background:#f3f4f6}.n{text-align:right}tfoot th{border-top:2px solid #333}@media print{body{margin:12mm}}</style>
  </head><body>
  <h1>${esc(d.titre)} - ${esc(d.periode)}</h1>
  ${tablePdf(d.colonnes, d.lignes, d.total)}
  <h2>${esc(d.annee.titre)}</h2>
  ${tablePdf(d.annee.colonnes, d.annee.lignes, d.annee.total)}
  </body></html>`;
  const w = window.open('', '_blank');
  if (!w){ toast('Autorisez les fenêtres pop-up pour imprimer'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

/* ---------- Actions (clics) ---------- */
const actions = {
  nav: ds => { state.view = ds.id; window.scrollTo(0,0); render(); },
  back: () => { state.view = 'home'; render(); },
  mois: ds => { state.mois = decalerMois(state.mois, +ds.d); render(); },
  logout: () => auth.signOut(),
  closeModal: () => closeModal(),
  formDelete: () => {
    const c = currentForm;
    closeModal();
    if (c?.onDelete) askConfirm('Mettre cette entrée à la corbeille ?', () => c.onDelete(), 'Mettre à la corbeille');
  },
  addDep: () => formDepense(null),
  editDep: ds => ds.kind === 'fixe' ? formFixe(ds.id) : formDepense(ds.id),
  delDep: ds => {
    const id = ds.id, kind = ds.kind;
    askConfirm(kind === 'fixe' ? 'Mettre cette charge fixe à la corbeille ? Elle sera retirée de tous les mois.' : 'Mettre cette dépense à la corbeille ?',
      () => kind === 'fixe' ? supprFixe(id) : supprExtra(id), 'Mettre à la corbeille');
  },
  addFixe: () => formFixeNouvelle(),
  addInfl: () => formInfl(null),
  editInfl: ds => formInfl(ds.id),
  delInfl: ds => {
    const id = ds.id;
    askConfirm('Mettre ce projet à la corbeille ?', () => supprInfl(id), 'Mettre à la corbeille');
  },
  toggleInfl: ds => toggleInfl(ds.id),
  addArt: () => formArt(null),
  editArt: ds => formArt(ds.id),
  delArt: ds => {
    const id = ds.id;
    askConfirm('Mettre cette facture à la corbeille ?', () => supprArt(id), 'Mettre à la corbeille');
  },
  toggleArt: ds => toggleArt(ds.id, ds.champ),
  /* Menu latéral */
  openMenu: () => { document.getElementById('drawer').hidden = false; },
  closeMenu: () => { document.getElementById('drawer').hidden = true; },
  sauvegarde: () => { actions.closeMenu(); sauvegarder().catch(() => toast('Sauvegarde impossible. Vérifiez votre connexion.')); },
  restaurer: () => { actions.closeMenu(); document.getElementById('fichier-restore').click(); },
  corbeilleView: () => { actions.closeMenu(); state.view = 'corbeille'; window.scrollTo(0,0); render(); },
  restaurerCorbeille: ds => restaurerCorbeille(ds.id),
  purgerCorbeille: ds => purgerCorbeille(ds.id),
  /* Confirmation */
  confirmOk: () => { const cb = confirmCb; closeConfirm(); if (cb) cb(); },
  confirmNo: () => closeConfirm(),
  /* Export */
  exportCsv: ds => exportCsv(ds.src),
  exportPdf: ds => exportPdf(ds.src)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el.dataset); }
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

/* ---------- Formulaires : soumission ---------- */
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'login-form'){
    const email = e.target.querySelector('[name=email]').value.trim();
    const pass = e.target.querySelector('[name=password]').value;
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
      const id = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
      toast(id.includes(err.code) ? 'E-mail ou mot de passe incorrect.' : 'Connexion impossible. Vérifiez votre connexion internet.');
    });
    return;
  }
  if (e.target.id === 'f') submitForm();
});

render();
